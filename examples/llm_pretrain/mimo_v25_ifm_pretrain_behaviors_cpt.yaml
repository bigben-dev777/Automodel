# MiMo-V2.5-Pro continuous pretraining recipe on IFM/Pretrain-Behaviors-style data.
#
# This recipe assumes you first preprocess one IFM subset (for example
# "reasoning" or "data-science") into Megatron .bin/.idx shards.
#
# Example preprocessing command for parquet shards that expose a `text` column:
#   uv run tools/preprocess_megatron_dataset.py \
#     --input "./ifm_pretrain_behaviors/reasoning/*.parquet" \
#     --input-type parquet \
#     --text-column text \
#     --json-keys text \
#     --output-prefix processed_data \
#     --output-path ./ifm_pretrain_behaviors/megatron_reasoning \
#     --workers 8 \
#     --pretrained-model-name-or-path XiaomiMiMo/MiMo-V2.5-Pro \
#     --append-eod
#
# IFM/Pretrain-Behaviors does not guarantee one global schema across subsets.
# Inspect the chosen subset with `datasets.load_dataset(...).features` first and
# update --text-column if the released parquet files use a different text field.
#
# To run this recipe:
#   uv run automodel examples/llm_pretrain/mimo_v25_ifm_pretrain_behaviors_cpt.yaml --nproc-per-node 8

recipe: TrainFinetuneRecipeForNextTokenPrediction

seed: 1111

step_scheduler:
  global_batch_size: 256
  local_batch_size: 4
  ckpt_every_steps: 500
  val_every_steps: 100
  num_epochs: 1
  max_steps: 5000

dist_env:
  backend: nccl
  timeout_minutes: 10

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: nemo_automodel.components.models.mimo_v25.config.MiMoV2Config.from_pretrained
    pretrained_model_name_or_path: XiaomiMiMo/MiMo-V2.5-Pro
    name_or_path: XiaomiMiMo/MiMo-V2.5-Pro
  trust_remote_code: false
  load_base_model: true
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: sdpa
    linear: torch
    rms_norm: torch_fp32
    rope_fusion: false
    dispatcher: deepep
    experts: torch_mm
    gate_precision: float32
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true

checkpoint:
  enabled: true
  checkpoint_dir: checkpoints/mimo_v25_ifm_cpt
  model_save_format: safetensors
  save_consolidated: false
  dequantize_base_checkpoint: true

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 4
  dp_size: 2
  ep_size: 8

  sequence_parallel: false
  activation_checkpointing: true

  pipeline:
    pp_schedule: interleaved1f1b
    pp_microbatch_size: 1
    layers_per_stage: 2
    round_virtual_stages_to_pp_multiple: down
    scale_grads_in_schedule: false
    patch_inner_model: false
    patch_causal_lm_model: false

  moe:
    reshard_after_forward: false
    wrap_outer_model: false

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.megatron_dataset.MegatronPretraining
  paths: ./ifm_pretrain_behaviors/megatron_reasoning/processed_data_*_text_document*  # REPLACE THIS
  index_mapping_dir: ./ifm_pretrain_behaviors/megatron_reasoning/mapping_dir  # REPLACE THIS
  tokenizer:
    _target_: nemo_automodel._transformers.auto_tokenizer.NeMoAutoTokenizer.from_pretrained
    pretrained_model_name_or_path: XiaomiMiMo/MiMo-V2.5-Pro
    trust_remote_code: true
  seq_length: 4096
  split: "0.995, 0.005, 0.000"
  splits_to_build: "train"

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: torch.utils.data.default_collate
  dataloader_type: "single"

validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.megatron_dataset.MegatronPretraining
  paths: ./ifm_pretrain_behaviors/megatron_reasoning/processed_data_*_text_document*  # REPLACE THIS
  index_mapping_dir: ./ifm_pretrain_behaviors/megatron_reasoning/mapping_dir  # REPLACE THIS
  tokenizer:
    _target_: nemo_automodel._transformers.auto_tokenizer.NeMoAutoTokenizer.from_pretrained
    pretrained_model_name_or_path: XiaomiMiMo/MiMo-V2.5-Pro
    trust_remote_code: true
  seq_length: 4096
  split: "0.995, 0.005, 0.000"
  splits_to_build: "validation"
  num_val_samples: 1024

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: torch.utils.data.default_collate
  dataloader_type: "single"

optimizer:
  _target_: torch.optim.AdamW
  betas: [0.9, 0.95]
  eps: 1e-8
  lr: 1.0e-5
  weight_decay: 0.1

lr_scheduler:
  lr_decay_style: cosine
  lr_warmup_steps: 100
  min_lr: 1.0e-6

wandb:
  enable: false
  project: automodel-mimo-v25-cpt
  name: mimo_v25_ifm_pretrain_behaviors_cpt
  mode: online