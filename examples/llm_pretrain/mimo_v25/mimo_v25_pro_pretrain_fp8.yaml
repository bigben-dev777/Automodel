# Continued pretraining recipe for MiMo-V2.5-Pro with FP8 expert GEMMs.
#
# Delta vs mimo_v25_pro_pretrain.yaml:
#   - model.backend.experts: torch_mm -> te
#   - model.backend.te_fp8.recipe: block
#
# This keeps the baseline distributed topology and data path unchanged while
# enabling Transformer Engine FP8 block scaling on the expert grouped GEMMs.
#
# JSONL format:
#   {"tokens": [token0, token1, ...]}
# or
#   {"input_ids": [token0, token1, ...]}
#
# JsonlTokenDataset shifts each block internally:
#   input_ids = block[:-1]
#   labels = block[1:]
# so set dataset.seq_len to desired_context_length + 1.

recipe: TrainFinetuneRecipeForNextTokenPrediction

seed: 1234

step_scheduler:
  global_batch_size: 288
  local_batch_size: 36
  ckpt_every_steps: 500
  num_epochs: 1
  max_steps: 1000
  save_checkpoint_every_epoch: false
  validate_on_checkpoint: false
  log_remote_every_steps: 1

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 18
  ep_size: 8
  defer_fsdp_grad_sync: true

  sequence_parallel: false
  activation_checkpointing: true

  pipeline:
    pp_schedule: interleaved1f1b
    pp_microbatch_size: 1
    layers_per_stage: 1
    round_virtual_stages_to_pp_multiple: down
    scale_grads_in_schedule: false
    patch_inner_model: false
    patch_causal_lm_model: false

  moe:
    reshard_after_forward: false
    wrap_outer_model: false

dist_env:
  backend: nccl
  timeout_minutes: 30

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: nemo_automodel.components.models.mimo_v25.config.MiMoV2Config.from_pretrained
    pretrained_model_name_or_path: XiaomiMiMo/MiMo-V2.5-Pro
    name_or_path: XiaomiMiMo/MiMo-V2.5-Pro
    architectures: [MiMoV25ForCausalLM]
  trust_remote_code: false
  load_base_model: true
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: sdpa
    linear: torch
    rms_norm: torch_fp32
    rope_fusion: false
    dispatcher: deepep
    experts: te
    gate_precision: float32
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true
    te_fp8:
      recipe: block

checkpoint:
  enabled: true
  checkpoint_dir: checkpoints/mimo_v25_pro_pretrain_fp8
  model_save_format: safetensors
  save_consolidated: false
  dequantize_base_checkpoint: true

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.jsonl_token_dataset.JsonlTokenDataset
  file_path: /path/to/mimo_v25_train.jsonl
  seq_len: 4097

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  shuffle: false
  collate_fn:
    _target_: nemo_automodel.components.datasets.utils.default_collater
    pad_seq_len_divisible: 64

packed_sequence:
  packed_sequence_size: 0

optimizer:
  _target_: torch.optim.AdamW
  betas: [0.9, 0.95]
  eps: 1e-8
  lr: 1.0e-5
  weight_decay: 0.1
  foreach: false

lr_scheduler:
  lr_decay_style: cosine
  lr_warmup_steps: 100
  min_lr: 1.0e-6

wandb:
  enable: false
  project: automodel-mimo-v25-pro
  name: mimo_v25_pro_pretrain_fp8
  mode: online

ci:
  recipe_owner: Simar-malhotra09
  # pp_size(18) * ep_size(8) = 144 GPUs => 18 nodes (8 H100/node).
  nodes: 18
  time: "02:00:00"