# Teutonic-II continuous pretraining on pretokenized .npy sequence shards.
#
# This recipe is designed for shards produced by datasets/build_npy_files.py.
# Those shards contain flat uint32 token arrays where each contiguous block of
# 2048 tokens is already one independent training sequence, so the dataset loader
# keeps sequence boundaries and masks the final label position of each block.
#
# To run this recipe:
#   uv run automodel examples/llm_pretrain/teutonic_ii_npy_pretrain.yaml --nproc-per-node 8

recipe: TrainFinetuneRecipeForNextTokenPrediction

seed: 1111

step_scheduler:
  global_batch_size: 256
  local_batch_size: 4
  ckpt_every_steps: 500
  val_every_steps: 100
  num_epochs: 1
  max_steps: 5000

dist_env:
  backend: nccl
  timeout_minutes: 30

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: nemo_automodel.components.models.mimo_v25.config.TeutonicIIConfig.from_pretrained
    pretrained_model_name_or_path: ../resources/models/Teutonic-II-110B-A7B  # replace with your local or HF path if needed
    name_or_path: ../resources/models/Teutonic-II-110B-A7B
  trust_remote_code: false
  load_base_model: true
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: sdpa
    linear: torch
    rms_norm: torch_fp32
    rope_fusion: false
    dispatcher: deepep
    experts: torch_mm
    gate_precision: float32
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true

checkpoint:
  enabled: true
  checkpoint_dir: checkpoints/teutonic_ii_npy_cpt
  model_save_format: safetensors
  save_consolidated: false
  dequantize_base_checkpoint: true

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 4
  dp_size: 2
  ep_size: 8

  sequence_parallel: false
  activation_checkpointing: true

  pipeline:
    pp_schedule: interleaved1f1b
    pp_microbatch_size: 1
    layers_per_stage: 2
    round_virtual_stages_to_pp_multiple: down
    scale_grads_in_schedule: false
    patch_inner_model: false
    patch_causal_lm_model: false

  moe:
    reshard_after_forward: false
    wrap_outer_model: false

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.npy_token_dataset.NpyTokenDataset
  file_pattern: ../datasets/your_train_shards/*.npy  # replace with one file or a glob of .npy shards
  seq_len: 2048
  shuffle_files: true

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn:
    _target_: nemo_automodel.components.datasets.utils.default_collater
    pad_seq_len_divisible: 64
  shuffle: false

validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.npy_token_dataset.NpyTokenDataset
  file_pattern: ../datasets/your_val_shards/*.npy  # replace with held-out validation shards
  seq_len: 2048
  shuffle_files: false

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn:
    _target_: nemo_automodel.components.datasets.utils.default_collater
    pad_seq_len_divisible: 64
  shuffle: false
  drop_last: true

optimizer:
  _target_: torch.optim.AdamW
  betas: [0.9, 0.95]
  eps: 1e-8
  lr: 1.0e-5
  weight_decay: 0.1

lr_scheduler:
  lr_decay_style: cosine
  lr_warmup_steps: 100
  min_lr: 1.0e-6

wandb:
  enable: false
  project: automodel-teutonic-ii-cpt
  name: teutonic_ii_npy_pretrain
  mode: online